<html th:replace="~{Customer/customerbase::layout(~{::main})}">
  <body>
    <main>
      <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="card border-0 shadow-lg rounded-4">
              <div class="card-body p-5">
                <!-- Header -->
                <div class="text-center mb-4">
                  <h2 class="text-primary fw-bold">
                    👤 Customer Profile
                  </h2>
                  <p class="text-muted">📋 Your registered information is listed below</p>
                  <hr class="w-25 mx-auto">
                </div>

                <!-- Profile Fields -->
                <div class="row mb-3">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold"><i class="bi bi-person-circle me-2"></i>Name</label>
                    <div class="form-control bg-light" th:text="${customer.name}">John Doe</div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold"><i class="bi bi-envelope-at me-2"></i>Email</label>
                    <div class="form-control bg-light" th:text="${customer.email}">john@example.com</div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold"><i class="bi bi-telephone me-2"></i>Phone</label>
                    <div class="form-control bg-light" th:text="${customer.phone}">+91 9876543210</div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold"><i class="bi bi-geo-alt-fill me-2"></i>Address</label>
                    <div class="form-control bg-light" th:text="${customer.address}">123 Street, City</div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold"><i class="bi bi-check-circle-fill me-2"></i>Account Status</label>
                    <div class="form-control bg-light text-success fw-bold" th:text="${customer.status}">ACTIVE</div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold"><i class="bi bi-calendar-check me-2"></i>Registered On</label>
                    <div class="form-control bg-light" th:text="${#temporals.format(customer.createdAt, 'dd MMM yyyy')}">01 Jan 2024</div>
                  </div>
                </div>

                <!-- Buttons -->
                <div class="text-center mt-4">
                  <a href="Dashboard" class="btn btn-outline-secondary me-2">
                    <i class="bi bi-arrow-left-circle me-1"></i> Back to Dashboard
                  </a>
                  <!-- <a th:href="@{/customer/editProfile}" class="btn btn-primary">
                    <i class="bi bi-pencil-square me-1"></i> Edit Profile
                  </a> -->
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Styling & Icons -->
      <style>
        .card:hover {
          box-shadow: 0 0 20px rgba(0, 0, 0, 0.08);
          transition: box-shadow 0.3s ease-in-out;
        }
        .form-control {
          border: none;
          background-color: #f8f9fa;
        }
        .form-label {
          margin-bottom: 4px;
          font-size: 0.95rem;
        }
      </style>

      <!-- Bootstrap Icons -->
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    </main>
  </body>
</html>
