<html th:replace="~{Customer/customerbase::layout(~{::main})}">
  <body>
    <main>
      <div class="container py-5 pt-3">
        <!-- Card Container -->
        <div class="row justify-content-center">
          <div class="col-lg-6">
            <div class="card border-0 shadow-lg rounded-4">
              <div class="card-body p-5 pt-4">
                <!-- Header -->
                <div class="text-center mb-4">
                  <h3 class="text-primary fw-bold">Change Your Password</h3>
                  <!-- <p class="text-muted">Please enter your current password, new password, and confirm the new password.</p> -->
                </div>

                <!-- Form -->
                <form th:action="@{CustomerChangePassword}" method="post">
                  <!-- Current Password Field -->
                  <div class="mb-4">
                    <label for="currentPassword" class="form-label fw-semibold">Current Password</label>
                    <input type="password" class="form-control" id="currentPassword" name="currentPassword" placeholder="Enter current password" required>
                  </div>

                  <!-- New Password Field -->
                  <div class="mb-4">
                    <label for="newPassword" class="form-label fw-semibold">New Password</label>
                    <input type="password" class="form-control" id="newPassword" name="newPassword" placeholder="Enter new password" required>
                    
                  </div>

                  <!-- Confirm New Password Field -->
                  <div class="mb-4">
                    <label for="confirmPassword" class="form-label fw-semibold">Confirm New Password</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password" required>
                    <small class="text-muted">Ensure the passwords match.</small>
                  </div>

                  <!-- Submit Button -->
                  <div class="text-center">
                    <button type="submit" class="btn btn-primary w-100">Change Password</button>
                  </div>
                </form>

                <!-- Back to Dashboard Button -->
                <div class="text-center mt-4">
                  <a href="Dashboard" class="btn btn-outline-secondary w-100">Back to Dashboard</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Custom Styling -->
      <style>
        .card {
          border-radius: 12px;
          box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .card:hover {
          box-shadow: 0 0 25px rgba(0, 0, 0, 0.2);
        }

        .form-control {
          border-radius: 8px;
          border: 1px solid #ced4da;
        }

        .form-label {
          font-size: 1rem;
          font-weight: 600;
        }

        .btn-primary {
          border-radius: 8px;
          font-size: 1rem;
        }

        .btn-outline-secondary {
          border-radius: 8px;
          font-size: 1rem;
        }

        .mb-4 small {
          font-size: 0.875rem;
        }

        .text-muted {
          font-size: 0.9rem;
        }
      </style>
    </main>
  </body>
</html>
