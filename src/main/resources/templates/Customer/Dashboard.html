<html th:replace="~{Customer/customerbase::layout(~{::main})}">
  <body>
    <main>
      <div class="container py-5">
        <h2 class="text-center text-primary fw-bold mb-5">
          👋 Welcome, <span th:text="${customer.name}">Customer</span>!
        </h2>

        <div class="row g-4">

          <!-- Customer Profile Overview -->
          <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4 bg-white h-100">
              <div class="card-body text-start p-4">
                <h5 class="fw-bold text-secondary mb-4">👤 Customer Profile</h5>
                <p><strong>📛 Name:</strong> <span th:text="${customer.name}">John Doe</span></p>
                <p><strong>📧 Email:</strong> <span th:text="${customer.email}">john@example.com</span></p>
                <p><strong>📱 Contact:</strong> <span th:text="${customer.phone}">+91-1234567890</span></p>
                <p><strong>🏠 Address:</strong> <span th:text="${customer.address}">Sitapur, India</span></p>
                <!-- <a href="/customer/profile" class="btn btn-outline-primary mt-3">Edit Profile</a> -->
              </div>
            </div>
          </div>

          <!-- My Complaints -->
          <div class="col-md-3">
            <div class="card shadow-lg border-0 rounded-4 bg-light h-100">
              <div class="card-body text-center">
                <h5 class="fw-bold text-secondary pt-4"><span class="fs-1">🛠️</span><br> My Complaints</h5>
                <h3 class="text-danger mt-3" th:text="${totalComplaints}">0</h3>
              </div>
            </div>
          </div>

          <!-- Feedback Given -->
          <div class="col-md-3">
            <div class="card shadow-lg border-0 rounded-4 bg-light h-100">
              <div class="card-body text-center">
                <h5 class="fw-bold text-secondary pt-4"><span class="fs-1">💬</span><br> Feedback</h5>
                <h3 class="text-success mt-3" th:text="${totalFeedbacks}">0</h3>
              </div>
            </div>
          </div>

          <!-- News & Events -->
          <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4 h-100 bg-white">
              <div class="card-body text-center">
                <h5 class="fw-bold text-secondary">📢 Latest News & Events</h5>
                <a href="ViewNewsEvents" class="btn btn-outline-dark mt-3 w-75">View News</a>
              </div>
            </div>
          </div>

          <!-- Logout -->
          <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4 h-100 bg-white">
              <div class="card-body text-center">
                <h5 class="fw-bold text-secondary">🔒 Logout</h5>
                <a href="Logout" class="btn btn-danger mt-3 w-50">Logout</a>
              </div>
            </div>
          </div>

        </div>
      </div>

      <style>
        .card:hover {
          transform: translateY(-6px);
          transition: all 0.3s ease-in-out;
        }

        h3 {
          font-size: 2rem;
        }

        .card-body p {
          font-size: 1rem;
          margin-bottom: 0.5rem;
        }
      </style>
    </main>
  </body>
</html>
