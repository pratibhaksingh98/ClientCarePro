<html th:replace="~{Customer/customerbase::layout(~{::main})}">
  <body>
    <main>
      <div class="container py-5 pt-3">
        <h2 class="mb-5 text-center text-primary fw-bold">
          📰 Latest <span class="text-success">News</span> & 🎉 Events
        </h2>

        <div class="row row-cols-1 row-cols-md-3 g-4 px-4">
          <div th:each="newsEvent : ${newsEvents}" class="col-md-6 px-3">
            <div class="card h-100 border-0 shadow p-1 rounded-4 position-relative">
              
              <!-- News Type Badge on Top -->
              <span class="position-absolute top-10 start-10 m-2 badge bg-info text-dark px-3 py-2 rounded-pill shadow-sm" 
                    th:text="${newsEvent.type}">
                Type
              </span>

              <!-- Image Banner -->
              <img th:src="@{'/NewsEvents/' + ${newsEvent.imageBanner}}"
                   class="card-img-top rounded-top-4"
                   alt="Banner Image"
                   style="height: 180px; object-fit: cover;" />

              <div class="card-body d-flex flex-column">
                <!-- Title -->
                <h5 class="card-title text-primary fw-bold mb-2">
                  <i class="bi bi-bell-fill text-warning me-1"></i>
                  <span th:text="${newsEvent.title}">Title</span>
                </h5>

                <!-- Description -->
                <p class="card-text text-muted small" th:text="${newsEvent.description}" 
                   style="max-height: 70px; overflow: hidden;">
                   Description
                </p>

                <!-- Info Section -->
                <div class="mt-auto">
                  <p class="mb-3">
                    <i class="bi bi-calendar-event text-secondary me-1"></i>
                    <strong class="text-secondary">Event Date:</strong>
                    <span th:text="${#temporals.format(newsEvent.eventDate, 'dd MMM yyyy HH:mm')}">Date</span>
                  </p>
                  <a th:href="@{ViewMoreNewsEvent(id = ${newsEvent.id})}" 
                     class="btn btn-sm btn-primary w-100">
                    <i class="bi bi-eye-fill me-1"></i> View More
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Empty Message -->
        <div th:if="${#lists.isEmpty(newsEvents)}" class="text-center mt-4">
          <p class="alert alert-warning"><i class="bi bi-info-circle-fill me-2"></i>No news or events available right now.</p>
        </div>
      </div>

      <!-- Custom Styling -->
      <style>
        .card:hover {
          box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
          transform: translateY(-5px);
          transition: all 0.3s ease;
        }
        .card-title {
          font-size: 1.15rem;
        }
        .badge {
          font-size: 0.75rem;
        }
        .btn-primary {
          background-color: #007bff;
          border: none;
        }
      </style>

      <!-- Bootstrap Icons -->
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    </main>
  </body>
</html>
