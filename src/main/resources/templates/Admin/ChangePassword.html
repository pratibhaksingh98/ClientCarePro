<html th:replace="~{Admin/adminbase::layout(~{::main})}">
  <body>
    <main class="p-5">
      <div class="col-md-7 mx-auto">
        <div class="card shadow-sm border-light">
          <div class="card-header bg-primary text-white">
            <i class="fas fa-key me-2"></i>
            <strong>Change Your Password</strong>
          </div>
          <div class="card-body p-5 pt-4">
            <!-- Display error or success message -->
            <div th:if="${error}" class="alert alert-danger">
              <span th:text="${error}"></span>
            </div>

            <!-- Change Password Form -->
            <form action="#" th:action="@{ChangePassword}" method="post">
              <div class="mb-3">
                <label for="currentPassword" class="form-label">Current Password</label>
                <input type="password" class="form-control" id="currentPassword" name="currentPassword" placeholder="Enter your current password" required />
              </div>
              
              <div class="mb-3">
                <label for="newPassword" class="form-label">New Password</label>
                <input type="password" class="form-control" id="newPassword" name="newPassword" placeholder="Enter your new password" required />
                <div id="newPasswordHelp" class="form-text">
                  Must be at least 8 characters, including uppercase, lowercase, and a number.
                </div>
              </div>
              
              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm New Password</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your new password" required />
              </div>
              
              <div class="d-grid gap-2 pt-4">
                <button type="submit" class="btn btn-primary">Change Password</button>
              </div>
            </form>
          </div>
        </div>
      </div>
      
    </main>
  </body>
</html>
