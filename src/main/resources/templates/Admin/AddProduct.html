<html lang="en" th:replace="~{Admin/adminbase::layout(~{::main})}">
<body>
<main class="p-4">
    <div class="col-md-8 mx-auto">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-primary text-white rounded-top-4">
                <h4 class="mb-0"><i class="fas fa-box me-2"></i> Add Product</h4>
            </div>
            <div class="card-body px-5 py-4">
                <form th:action="@{AddProduct}" method="post" th:object="${productDto}" enctype="multipart/form-data">
                    
                    <!-- Product Name -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Product Name</label>
                        <input type="text" class="form-control rounded-pill" th:field="*{name}" required placeholder="Product Name..."/>
                    </div>

                    <!-- Description -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Description</label>
                        <textarea class="form-control rounded-3" th:field="*{description}" rows="3" placeholder="Enter product description..."></textarea>
                    </div>

                    <!-- Price & Availability -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Price</label>
                            <input type="number" step="0.01" class="form-control rounded-pill" th:field="*{price}" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Availability</label>
                            <select class="form-select rounded-pill" th:field="*{availabilityStatus}" required>
                                <option value="" selected>Select availability</option>
                                <option value="AVAILABLE">Available</option>
                                <option value="OUT_OF_STOCK">Out of Stock</option>
                            </select>
                        </div>
                    </div>

                    <!-- Category -->
					<div class="mb-3">
    					<label class="form-label fw-semibold">Category</label>
    					<select class="form-select rounded-pill" th:field="*{categoryId}" required>
        					<option value="" selected>Select category</option>
        					<option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.category}"></option>
    					</select>
					</div>

                    <!-- Image Upload -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Upload Product Image</label>
                        <input type="file" class="form-control rounded-pill" name="imageFile" accept="image/*" required />
                    </div>

                    <!-- Buttons -->
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-success px-4 rounded-pill">
                            <i class="fas fa-save me-1"></i> Save
                        </button>
                        <a th:href="@{ViewProduct}" class="btn btn-secondary px-4 rounded-pill">
                            <i class="fas fa-arrow-left me-1"></i> Cancel
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
