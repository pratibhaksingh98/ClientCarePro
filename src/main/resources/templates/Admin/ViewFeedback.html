<html th:replace="~{Admin/adminbase::layout(~{::main})}">
  <body>
    <main class="p-4">
      <div class="card mb-4">
        <div class="card-header fw-bold">
          <i class="fas fa-comment me-1"></i>
          All Feedback Entries
        </div>
        <div class="card-body">
          <table id="datatablesSimple" class="table table-bordered table-hover">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>Customer Name</th>
                <th>Rating</th>
                <th>Comments</th>
                <th>Feedback Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="fb, srno : ${feedbackList}">
                <td th:text="${srno.index + 1}">1</td>
                <td th:text="${fb.customer.name}">John Doe</td>
                <td th:text="${fb.rating+'/5'}">5</td>
                <td th:text="${fb.comments}">Great service!</td>
                <td th:text="${fb.feedbackDate}">2025-05-01</td>
                <td>
                  
                  <!-- Delete Button -->
                  <a style="white-space: nowrap;" th:href="@{DeleteFeedback(id= ${fb.id})}" class="btn btn-sm btn-danger rounded-pill" onclick="return confirm('Are you sure you want to delete this feedback?');">
                    <i class="fas fa-trash"></i> Delete
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </body>
</html>
