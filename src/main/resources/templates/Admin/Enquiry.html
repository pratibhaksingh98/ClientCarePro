<html th:replace="~{Admin/adminbase::layout(~{::main})}">
  <body>
    <main class="p-4">
      <div class="card mb-4 shadow rounded-4">
        <div class="card-header fw-bold bg-primary text-white">
          <i class="fas fa-envelope me-1"></i>
          All Enquiries
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table id="datatablesSimple" class="table table-bordered table-striped text-center">
              <thead class="table-light">
                <tr>
                  <th>#</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Address</th>
                  <th>Message</th>
                  <th>Enquiry Date</th>
                  <th>Status</th>
                  <th>Response</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="enquiry, iterStat : ${enquiries}">
                  <td th:text="${iterStat.count}"></td>
                  <td th:text="${enquiry.name}"></td>
                  <td th:text="${enquiry.email}"></td>
                  <td th:text="${enquiry.contactno}"></td>
                  <td th:text="${enquiry.address}"></td>
                  <td th:text="${enquiry.message.length() > 40 ? enquiry.message.substring(0, 40) + '...' : enquiry.message}"></td>
                  <td th:text="${enquiry.enquirydate}"></td>
                  <td>
                    <span th:text="${enquiry.status}"
                          th:classappend="${enquiry.status == 'RESOLVED'} ? 'badge bg-success' : 'badge bg-warning text-dark'">
                    </span>
                  </td>
                  <td th:text="${enquiry.adminResponse != null ? enquiry.adminResponse : 'No response yet'}"></td>
                  <td>
                    <!-- <a th:href="@{'/admin/respondEnquiry/' + ${enquiry.id}}" class="btn btn-sm btn-info rounded-pill">
                      <i class="fas fa-reply"></i> Respond
                    </a> -->
                    <a th:href="@{DeleteEnquiry(id=${enquiry.id})}" class="btn btn-sm btn-danger rounded-pill"
                       onclick="return confirm('Are you sure you want to delete this enquiry?');">
                      <i class="fas fa-trash"></i> Delete
                    </a>
                  </td>
                </tr>
                <tr th:if="${enquiries.size() == 0}">
                  <td colspan="10">No enquiries found.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      
      <style>
      	td,th{
      		white-space: nowrap;
      	}
      </style>
    </main>
  </body>
</html>
