<html lang="en" th:replace="~{Admin/adminbase::layout(~{::main})}">
<body>
<main class="p-4 pt-0">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-header bg-gradient-primary text-white text-center rounded-top-4" 
                         style="background: linear-gradient(to right, #0d6efd, #3b82f6);">
                        <h3 class="mb-0">Add New Customer</h3>
                        <p class="mb-0">Fill out the details below to register a customer</p>
                        
                    </div>

                    <div class="card-body p-5 pt-4">
                        <form th:action="@{AddCustomer}" th:object="${customerDto}" method="post">
                            	
                            <p th:if="${msg}" th:text="${msg}" class="text-success text-center"></p>
                            <p th:if="${error}" th:text="${error}" class="text-danger text-cetner"></p>
                            <div class="row g-3 pt-2">
                                <div class="col-md-6">
                                    <label for="name" class="form-label">Full Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-person-fill"></i></span>
                                        <input type="text" id="name" th:field="${customerDto.name}" class="form-control" placeholder="John Doe" required>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label for="email" class="form-label">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-envelope-fill"></i></span>
                                        <input type="email" id="email" th:field="${customerDto.email}" class="form-control" placeholder="john@example.com" required>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label for="phone" class="form-label">Phone Number</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-telephone-fill"></i></span>
                                        <input type="text" id="phone" th:field="${customerDto.phone}" class="form-control" placeholder="9876543210" required>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label for="password" class="form-label">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                                        <input type="password" id="password" th:field="${customerDto.password}" class="form-control" placeholder="Enter password" required>
                                    </div>
                                </div>

                                <div class="col-12">
                                    <label for="address" class="form-label">Address</label>
                                    <textarea id="address" th:field="${customerDto.address}" class="form-control" rows="3" placeholder="Enter address here..."></textarea>
                                </div>

                                
                            </div>

                            <div class="text-center mt-4">
                                <button type="submit" class="btn btn-primary px-5 py-2 rounded-pill">
                                    <i class="bi bi-person-plus-fill me-2"></i>Add Customer
                                </button>
                            </div>

                        </form>
                    </div>

                </div>

            </div>
        </div>
    </div>
</main>

<!-- Bootstrap Icons CDN (if not already added) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

</body>
</html>
