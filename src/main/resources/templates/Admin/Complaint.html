<html th:replace="~{Admin/adminbase::layout(~{::main})}">
  <body>
    <main class="p-4">
      <div class="card mb-4 shadow rounded-4">
        <div class="card-header fw-bold bg-danger text-white">
          <i class="fas fa-exclamation-triangle me-1"></i>
          Customer Complaints
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table id="datatablesSimple" class="table table-bordered table-striped text-center">
              <thead class="table-light">
                <tr>
                  <th>#</th>
                  <th>Customer Name</th>
                  <th>Issue</th>
                  <th>Details</th>
                  <th>Date</th>
                  <!-- <th>Status</th> -->
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="complaint, iterStat : ${complaints}">
                  <td th:text="${iterStat.count}"></td>
                  <td th:text="${complaint.customer.name}"></td>
                  <td th:text="${complaint.issue}"></td>
                  <td th:text="${complaint.details.length() > 40 ? complaint.details.substring(0, 40) + '...' : complaint.details}"></td>
                  <td th:text="${complaint.complaintDate}"></td>
                  <!-- <td>
                    <span th:text="${complaint.status}" 
                          th:classappend="${complaint.status.name() == 'CLOSED' ? 'badge bg-success' : 
                                          (complaint.status.name() == 'PENDING') ? 'badge bg-warning text-dark' : 
                                          'badge bg-danger'}">
                    </span>
                  </td> -->
                  <td>
                    <!-- <a th:href="@{'/admin/respondComplaint/' + ${complaint.id}}" class="btn btn-sm btn-info rounded-pill">
                      <i class="fas fa-reply"></i> Respond
                    </a> -->
                    <a th:href="@{DeleteComplaint(id=${complaint.id})}" class="btn btn-sm btn-danger rounded-pill"
                       onclick="return confirm('Are you sure you want to delete this complaint?');">
                      <i class="fas fa-trash-alt"></i> Delete
                    </a>
                  </td>
                </tr>
                <tr th:if="${complaints.size() == 0}">
                  <td colspan="7">No complaints found.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      
      <style>
      	td,th{
      		white-space: nowrap;
      	}
      </style>
    </main>
  </body>
</html>
