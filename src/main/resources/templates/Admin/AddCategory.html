<html lang="en" th:replace="~{Admin/adminbase::layout(~{::main})}">
<body>
<main class="p-4">
    <div class="col-md-6 mx-auto pt-5">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-primary text-white rounded-top-4">
                <h4 class="mb-0"><i class="fas fa-tags me-2"></i>Add Category</h4>
            </div>
            <div class="card-body px-5 py-4">
                <form th:action="@{AddCategory}" method="post">
                    <p th:if="${error}" th:text="${error}" class="text-danger p-2"></p>
                    <p th:if="${success}" th:text="${success}" class="text-success p-2"></p>
                    <!-- Category Name -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Category Name</label>
                        <input type="text" class="form-control rounded-pill" name="category" placeholder="Enter category name" required />
                    </div>

                    <!-- Buttons -->
                    <div class="d-flex justify-content-center">
                        <button type="submit" class="btn btn-success px-4 rounded-pill">
                            <i class="fas fa-save me-1"></i> Save
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
