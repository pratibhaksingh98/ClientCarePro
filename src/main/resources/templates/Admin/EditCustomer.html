<html lang="en" th:replace="~{Admin/adminbase::layout(~{::main})}">
<body>
<main class="p-4">
    <div class="col-md-8 mx-auto">
    	<div class="card bg-warning" th:if="${error}" th:txet="${error}"></div>
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-primary text-white rounded-top-4">
                <h4 class="mb-0"><i class="fas fa-user-edit me-2"></i>Edit Customer</h4>
            </div>
            <div class="card-body px-5 py-4">
                <form th:action="@{UpdateCustomer}" method="post" th:object="${customer}">
                    <input type="hidden" th:field="*{id}" />

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control rounded-pill" th:field="*{name}" placeholder="Enter full name" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Email Address</label>
                            <input type="email" class="form-control rounded-pill" th:field="*{email}" placeholder="example@mail.com" required />
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Phone Number</label>
                            <input type="text" class="form-control rounded-pill" th:field="*{phone}" placeholder="Enter phone number" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Status</label>
                            <select class="form-select rounded-pill" th:field="*{status}">
                                <option value="ACTIVE">Active</option>
                                <option value="INACTIVE">Inactive</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Address</label>
                        <textarea class="form-control rounded-3" th:field="*{address}" rows="3" placeholder="Enter address here..."></textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-success px-4 rounded-pill">
                            <i class="fas fa-save me-1"></i>Update
                        </button>
                        <a th:href="@{ViewAllCustomer}" class="btn btn-secondary px-4 rounded-pill">
                            <i class="fas fa-arrow-left me-1"></i>Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
