<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Admin Forgot Password</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#0d6efd;
font-family:Arial;
}

.navbar{
background:white;
padding:15px 80px;
}

.forgot-box{
width:430px;
background:white;
padding:35px;
border-radius:18px;
margin:auto;
margin-top:90px;
box-shadow:0px 5px 15px rgba(0,0,0,0.2);
}

.btn-reset{
background:#0d6efd;
color:white;
width:100%;
border-radius:30px;
padding:12px;
font-weight:bold;
border:none;
}

.footer{
text-align:center;
margin-top:20px;
}
</style>
</head>

<body>

<nav class="navbar d-flex justify-content-between">
<h2><b>ClientCare Pro</b></h2>

<div>
<a href="/">Home</a>&nbsp;&nbsp;
<a href="/about">About Us</a>&nbsp;&nbsp;
<a href="/services">Services</a>&nbsp;&nbsp;
<a href="/contact">Contact Us</a>
</div>

<a href="/AdminLogin" class="btn btn-primary rounded-pill">
Go To Login
</a>
</nav>

<div class="forgot-box">

<h2 class="text-center fw-bold">FORGOT PASSWORD</h2>
<p class="text-center text-muted">Reset your admin password</p>

<p class="text-center text-danger" th:if="${msg}" th:text="${msg}"></p>

<form th:action="@{/AdminForgotPassword}" method="post">

<div class="mb-3">
<label>Email</label>
<input type="email" name="email" class="form-control" placeholder="Enter admin email" required>
</div>

<div class="mb-3">
<label>New Password</label>
<input type="password" name="newPassword" class="form-control" placeholder="Enter new password" required>
</div>

<div class="mb-3">
<label>Confirm Password</label>
<input type="password" name="confirmPassword" class="form-control" placeholder="Confirm password" required>
</div>

<button type="submit" class="btn-reset">
Reset Password
</button>

</form>

<div class="text-center mt-3">
<a href="/AdminLogin">Back to Login</a>
</div>

</div>

<div class="footer">
© 2025 ClientCare Pro | Admin Panel
</div>

</body>
</html>
