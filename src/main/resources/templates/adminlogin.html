<!-- index.html -->
<html th:replace="~{base::layout(~{::main})}">
<body>
	<main class="p-0">		
		<!-- Admin Login Section -->
<section class="py-5 bg-primary d-flex align-items-center justify-content-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4">

                        <div class="text-center mb-3">
                            <i class="fas fa-user-shield fa-2x text-primary mb-2"></i>
                            <h4 class="fw-bold text-uppercase">Admin Login</h4>
                            <p class="text-muted small">Secure access to the admin dashboard</p>
                            <p class="medium text-danger text-center" th:if="${msg}" th:text="${msg}"></p>
                            
                        </div>

                        <form th:action="@{/AdminLogin}" method="post">
                            <div class="mb-3">
                                <label for="adminUsername" class="form-label"><i class="fas fa-user me-2"></i>Username</label>
                                <input type="text" id="adminUsername" name="username" class="form-control rounded" placeholder="Enter admin username" required>
                            </div>

                            <div class="mb-3">
                                <label for="adminPassword" class="form-label"><i class="fas fa-lock me-2"></i>Password</label>
                                <input type="password" id="adminPassword" name="password" class="form-control rounded" placeholder="Enter password" required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary rounded-pill">
                                    <i class="fas fa-sign-in-alt me-1"></i> Login
                                </button>
                            </div>

                            <div class="text-center mt-3">
                                <a href="/AdminForgotPassword">Forgot password?</a>
                            </div>
                        </form>

                    </div>
                </div>
                <p class="text-center text-muted mt-3 small">
                    &copy; 2025 ClientCare Pro | Admin Panel
                </p>
            </div>
        </div>
    </div>
</section>
		
	</main>
</body>
</html>
