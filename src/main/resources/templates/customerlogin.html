<!-- index.html -->
<html th:replace="~{base::layout(~{::main})}">
<body>
	<main class="p-0">	
		<!-- Customer Login Section -->
<section class="py-5 bg-success d-flex align-items-center justify-content-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">

                        <div class="text-center mb-3">
                            <i class="fas fa-user-circle fa-2x text-success mb-2"></i>
                            <h4 class="fw-bold text-uppercase">Customer Login</h4>
                            <p class="text-muted small">Access your ClientCare Pro account</p>
                            <p class="medium text-danger text-center" th:if="${msg}" th:text="${msg}"></p>
                            
                        </div>

                        <form th:action="@{/CustomerLogin}" method="post">
                            <div class="mb-3">
                                <label for="email" class="form-label"><i class="fas fa-envelope me-2"></i>Email</label>
                                <input type="email" id="email" name="email" class="form-control rounded" placeholder="Enter your email" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label"><i class="fas fa-lock me-2"></i>Password</label>
                                <input type="password" id="password" name="password" class="form-control rounded" placeholder="Enter password" required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-success rounded-pill">
                                    <i class="fas fa-sign-in-alt me-1"></i> Login
                                </button>
                            </div>

                            <div class="text-center mt-3">
                                <a href="/CustomerRegister" class="small text-decoration-none text-muted">
                                           New User? Register here
                                 </a>
                            </div>
                        </form>

                    </div>
                </div>
                <p class="text-center text-muted mt-3 small">
                    &copy; 2025 ClientCare Pro | Customer Portal
                </p>
            </div>
        </div>
    </div>
</section>
		
		
	</main>
</body>
</html>
